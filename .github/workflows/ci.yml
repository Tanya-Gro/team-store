name: Проверка проекта

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev, main]
jobs:
  quality-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
      - run: npm ci
      - run: npm run format
      - run: npm run lint
      - run: npm test
      - run: npm run build
